<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository — Yasam Panel</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside><div class="brand">YASAM <span>PANEL</span></div><nav><a href="/dashboard.html">Dashboard</a><a class="active" href="/github.html">GitHub</a><a href="/domains.html">Subdomains / DNS</a></nav></aside><main class="content"><header><div><a href="/github.html">← Repositories</a><h1 id="title">Repository</h1><p id="desc" class="muted"></p></div><div class="actions"><button id="renameRepo" class="secondary">Rename</button><button id="deleteRepo" class="danger">Delete repo</button></div></header><div class="toolbar"><button id="newFile">+ File</button><button id="newFolder" class="secondary">+ Folder</button><input id="path" placeholder="Folder path, e.g. src/components"><button id="goPath" class="secondary">Open</button></div><div id="breadcrumb" class="muted"></div><div id="files" class="filelist card"></div></main></div><dialog id="editorDialog"><form method="dialog" class="modal wide"><h2 id="editorTitle">Edit file</h2><input id="filePath" placeholder="path/file.js" required><textarea id="fileContent" spellcheck="false"></textarea><input id="commitMessage" placeholder="Commit message"><input id="fileSha" type="hidden"><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="saveFile">Save</button></div></form></dialog><dialog id="folderDialog"><form method="dialog" class="modal"><h2>New folder</h2><input id="folderPath" placeholder="folder/name" required><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="saveFolder">Create</button></div></form></dialog><script src="/js/repo.js"></script></body></html>
